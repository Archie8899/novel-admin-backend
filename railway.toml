[railway]
entrypoint = "node dist/index.js"

[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build"

[deploy]
healthCheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
startCommand = "npx prisma generate && npx prisma db push --accept-data-loss && node dist/index.js"

[nixpacks]
node_version = "20"

# 声明 PostgreSQL 依赖，让 Railway 在启动前等待数据库就绪
[nodejs]
packages = []

[postgres]
name = "db"
